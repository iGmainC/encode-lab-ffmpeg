name: Build Encode Lab FFmpeg Runtime

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: "Encode Lab runtime release version"
        required: true
        default: "8.1.1-rpu.2"
      ffmpeg_version:
        description: "FFmpeg release version"
        required: true
        default: "8.1.1"
      create_release:
        description: "Create an immutable GitHub release"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: ffmpeg-runtime-${{ inputs.runtime_version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            target: linux-x64
          - os: macos-15
            platform: macos
            target: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust for dovi_tool
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: ./scripts/install-deps-linux.sh

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: ./scripts/install-deps-macos.sh

      - name: Setup MSYS2
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            base-devel
            curl
            git
            mingw-w64-ucrt-x86_64-aom
            mingw-w64-ucrt-x86_64-dav1d
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libtool
            mingw-w64-ucrt-x86_64-libvpx
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-svt-av1
            mingw-w64-ucrt-x86_64-x264
            mingw-w64-ucrt-x86_64-x265
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-zimg
            rsync
            tar
            xz

      - name: Build Unix runtime
        if: matrix.platform != 'windows'
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}
          RUNTIME_SOURCE_COMMIT: ${{ github.sha }}
        run: ./scripts/build-unix.sh "${{ matrix.target }}"

      - name: Build Windows runtime
        if: matrix.platform == 'windows'
        env:
          FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}
        shell: msys2 {0}
        run: ./scripts/build-windows-msys2.sh "${{ matrix.target }}"

      - name: Package artifact
        run: |
          cd dist
          COPYFILE_DISABLE=1 tar -czf "encode-lab-ffmpeg-${{ matrix.target }}.tar.gz" "${{ matrix.target }}"

      - name: Verify Linux artifact on minimum runtime baseline
        if: matrix.platform == 'linux'
        run: |
          docker run --rm \
            -v "${PWD}/dist/${{ matrix.target }}:/runtime:ro" \
            ubuntu:22.04 \
            bash -euc '
              export LD_LIBRARY_PATH=/runtime/lib
              /runtime/bin/ffmpeg -hide_banner -version >/dev/null
              /runtime/bin/ffprobe -hide_banner -version >/dev/null
              /runtime/bin/x265 --version >/dev/null
              /runtime/bin/dovi_tool --version >/dev/null
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: encode-lab-ffmpeg-${{ matrix.target }}
          path: dist/encode-lab-ffmpeg-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release assets
    runs-on: ubuntu-24.04
    needs: build
    if: inputs.create_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: encode-lab-ffmpeg-*
          path: release-assets
          merge-multiple: true

      - name: Reject an existing runtime version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ffmpeg-${{ inputs.runtime_version }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "runtime release already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "runtime tag already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Generate release asset checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ffmpeg-${{ inputs.runtime_version }}
          name: Encode Lab FFmpeg Runtime ${{ inputs.runtime_version }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
